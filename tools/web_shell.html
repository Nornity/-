<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нижний уровень · Объект 07</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080e10;color:#dcded1;overflow:hidden}body{font-family:Consolas,monospace}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#boot{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#162224,#080e10 70%);z-index:5}.loader{width:min(380px,80vw)}.id{font-size:11px;color:#d0674d;letter-spacing:4px}.name{font-family:Arial,sans-serif;font-weight:800;font-stretch:condensed;font-size:40px;letter-spacing:-1px;line-height:1;margin:26px 0 32px}.rule{height:2px;background:#263338}.rule i{display:block;height:100%;background:#dc654c;width:0;transition:width .15s}.caption{display:flex;justify-content:space-between;font-size:10px;color:#91a1a1;letter-spacing:1px;margin-top:14px}#error{white-space:pre-wrap;color:#e9846b;font-size:12px;line-height:1.7;margin-top:20px}#launch{display:none;background:#d9654c;color:#10191a;border:0;padding:16px;width:100%;margin-top:26px;font:700 12px Consolas,monospace;letter-spacing:2px;cursor:pointer}
</style>
</head>
<body><canvas id="canvas" tabindex="0" aria-label="Нижний уровень — игра на Godot"></canvas>
<div id="boot"><div class="loader"><div class="id">ОБЪЕКТ 07 / ПОДКЛЮЧЕНИЕ</div><div class="name">НИЖНИЙ<br>УРОВЕНЬ</div><div class="rule"><i id="bar"></i></div><div class="caption"><span id="status">ЗАГРУЗКА СЕКТОРА</span><span id="percent">0%</span></div><button id="launch">ВОЙТИ В ОБЪЕКТ →</button><div id="error"></div></div></div>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas');
const params=new URLSearchParams(location.search);
const engine=new Engine({canvas,executable:'index',mainPack:'index.pck',canvasResizePolicy:2,focusCanvas:true,ensureCrossOriginIsolationHeaders:false,gdextensionLibs:[],persistentPaths:params.has('test')?[]:['/userfs'],args:params.has('test')?['--','--smoke-test']:[],onProgress:(loaded,total)=>{const p=total?Math.min(100,Math.round(loaded/total*100)):0;document.getElementById('bar').style.width=p+'%';document.getElementById('percent').textContent=p+'%';},onPrint:(...a)=>{console.log(...a);if(a.join(' ').includes('LOWER_LEVEL_READY')){window.__gameReady=true;document.getElementById('boot').style.display='none';}},onPrintError:(...a)=>console.error(...a)});
engine.startGame().then(()=>{document.getElementById('boot').style.display='none';canvas.focus();window.__engine=engine;}).catch(err=>{document.getElementById('status').textContent='ПОДКЛЮЧЕНИЕ ПРЕРВАНО';document.getElementById('error').textContent='Не удалось запустить WebGL 2. Попробуйте открыть предпросмотр в отдельной вкладке или запустите project.godot в Godot 4.5+.\n\n'+err;});
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('pagehide',()=>navigator.sendBeacon('/__quit',''),{once:true});
</script></body></html>
